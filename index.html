<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상황에 맞는 기체 카드를 내요! | 어게인 실험과학 수학학원</title>
<meta name="description" content="화면의 상황에 맞는 기체 카드를 내면 무슨 일이 벌어질까요? 틀린 카드도 내 보며 기체의 쓰임을 알아봐요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#e8f4fd; --sky2:#bfe0f8; --blue:#3a9ae0; --blue-d:#2476b8; --line:#d3e7f5;
  --warm:#ff8a3d; --warm-d:#e0661c; --warm-s:#fff0e3;
  --navy:#24407e; --navy-d:#172c5c; --navy-s:#e7ecf8;
  --ruby:#d81e4a; --ruby-d:#a3102f; --ink:#33414f; --sub:#6c7a8a;
  --mint:#dcf5ea; --mint2:#8fdcb8; --gold:#ffb800;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:500;background:#fff}
body{min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.jua,header,nav,.bbtn,.sit,.hint,.rmsg,.mark,.final,.gc,.dot-wrap,.quiz,footer,dialog{font-family:"Jua","Noto Sans KR",sans-serif}

.bbtn{font-size:22px;min-height:60px;min-width:140px;padding:8px 26px;color:#fff;background:var(--navy);border-radius:999px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 5px 0 var(--navy-d);word-break:keep-all}
.bbtn:active{transform:translateY(3px)}
.bbtn.warm{background:var(--warm);box-shadow:inset 0 -6px 0 rgba(0,0,0,.1),0 5px 0 var(--warm-d)}
.bbtn.white{background:#fff;color:var(--navy);box-shadow:inset 0 -6px 0 rgba(0,0,0,.05),0 5px 0 var(--line);border:3px solid var(--sky2)}

header{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 3px 0 var(--line);padding:8px 16px}
.head-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.titles{flex:1;min-width:0}
.brand{font-size:16px;color:var(--sub)}
h1{margin:0;font-weight:400;font-size:clamp(20px,3.2vw,32px);color:var(--navy);line-height:1.15;word-break:keep-all}
.share{min-width:0;font-size:18px;min-height:50px;padding:6px 22px;flex:none}
.mute{min-width:0;width:50px;height:50px;min-height:0;padding:0;flex:none;display:grid;place-items:center}
.mute svg{width:28px;height:28px}
.mute .off{display:none}.mute.muted .on{display:none}.mute.muted .off{display:block}

nav{max-width:1240px;width:100%;margin:10px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{position:relative;min-height:54px;border-radius:18px;background:var(--sky);font-size:clamp(16px,2vw,24px);line-height:1.15;padding:4px;
  border:3px solid transparent;word-break:keep-all;text-align:center}
.tab.on{background:var(--navy-s);border-color:var(--navy);color:var(--navy)}
.tab .star{position:absolute;top:-10px;right:-2px;font-size:24px;color:var(--gold);display:none}
.tab.done .star{display:block;animation:pop .5s}

main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:8px 16px 14px}
.panel{display:none}
.panel.on{display:block}

/* 게임 */
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.dot-wrap{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--sky2);display:inline-block;flex:none}
.dot.done{background:var(--navy);border-color:var(--navy)}
.dot.first{background:var(--gold);border-color:#d99a00}
.dot.now{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-s)}
.stars{font-size:clamp(20px,2vw,26px);color:#c98a00;margin-left:8px;white-space:nowrap}
.again{min-width:0;font-size:17px;min-height:42px;padding:2px 16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05),0 3px 0 var(--line)}
.sit{text-align:center;margin:2px 0 8px}
.sit h2{margin:0;font-weight:400;color:var(--navy);font-size:clamp(25px,3.5vw,44px);line-height:1.15;word-break:keep-all}
.sit p{margin:3px 0 0;font-size:clamp(18px,2.2vw,28px);line-height:1.25;word-break:keep-all}
.stage{position:relative;height:clamp(170px,calc(100vh - 505px),520px);border-radius:24px;overflow:hidden;box-shadow:0 0 0 3px var(--line);transition:box-shadow .15s;background:#f6fbff}
.stage svg{display:block;width:100%;height:100%}
.stage.over{box-shadow:0 0 0 7px var(--warm)}
svg text{font-family:"Jua","Noto Sans KR",sans-serif}
.dock{margin-top:8px;display:grid}
@media (min-width:761px){.dock{min-height:172px}}
.hint{text-align:center;font-size:clamp(18px,2vw,25px);color:var(--warm-d);margin-bottom:6px;line-height:1.2;word-break:keep-all}
.hint small{font-size:.76em;color:var(--sub);white-space:nowrap}
.hand{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.hand.n4{grid-template-columns:repeat(4,minmax(0,210px));justify-content:center}
.hand.busy{opacity:.55;pointer-events:none}
.gc{--d:var(--c);--d:color-mix(in srgb,var(--c) 78%,#000);position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;background:#fff;border:3px solid var(--d);border-radius:16px;
  padding:0 0 8px;overflow:hidden;color:var(--d);touch-action:none;cursor:grab;box-shadow:0 4px 0 var(--line);transition:transform .12s,opacity .2s,filter .2s}
.gc:active{transform:translateY(2px)}
.gc .bd{align-self:stretch;background:var(--d);color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:2px 8px 3px;font-family:system-ui,sans-serif;font-weight:800;font-size:clamp(12px,1.35vw,18px);line-height:1.2}
.gc .ic{display:block;width:clamp(36px,5.2vw,66px);margin:5px auto 2px;pointer-events:none}
.gc .ic svg{display:block;width:100%;height:auto}
.gc .nm{color:var(--ink);font-size:clamp(15px,1.85vw,24px);line-height:1.12;word-break:keep-all;text-align:center;padding:0 4px}
.gc.played{opacity:.38;filter:grayscale(.7)}
.gc.lift{opacity:.15}
.ghost{position:fixed;z-index:80;margin:0;pointer-events:none;box-shadow:0 14px 26px rgba(0,0,0,.28);cursor:grabbing;transition:none}
.result{display:none;align-items:center;gap:18px;border-radius:24px;border:4px solid;padding:12px 20px;animation:pop .35s}
.result.on{display:grid;grid-template-columns:auto minmax(0,1fr) auto}
.result.ok{background:var(--mint);border-color:var(--mint2)}
.result.near{background:#fff6dc;border-color:#f1cf6b}
.result.bad{background:#ffe9ec;border-color:#f3a4b3}
.mark{text-align:center;font-size:clamp(20px,2.2vw,28px);line-height:1.1;white-space:nowrap}
.mark b{display:block;font-weight:400;font-size:2em;line-height:1}
.ok .mark{color:#1f8a57}.near .mark{color:#a87a06}.bad .mark{color:#c8283a}
.rmsg{font-size:clamp(21px,2.45vw,31px);line-height:1.36;word-break:keep-all}
.final{display:none;text-align:center;border-radius:24px;background:var(--navy-s);padding:clamp(20px,5vh,48px) 16px}
.final.on{display:block;animation:pop .45s}
.final h2{margin:0;font-weight:400;font-size:clamp(38px,6vw,68px);color:var(--navy)}
.final p{margin:10px 0 18px;font-size:clamp(21px,2.8vw,32px);line-height:1.4;word-break:keep-all}
.final .bigstar{display:block;font-size:clamp(30px,4.4vw,50px);color:var(--gold);letter-spacing:.06em;line-height:1.2}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}

/* 도감 */
.dex{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:8px}
.dex .gc{cursor:pointer;touch-action:manipulation;padding-bottom:12px}
.dex .gc .ic{width:clamp(50px,7.4vw,96px);margin:10px auto 4px}
.dex .gc .nk{color:var(--sub);font-family:"Noto Sans KR",sans-serif;font-size:clamp(12px,1.25vw,16px);line-height:1.2;word-break:keep-all;text-align:center;padding:2px 4px 0}
.dex .gc.art{padding:0;background:#fff;overflow:hidden}
.dex .gc.art img{display:block;width:100%;aspect-ratio:1082/1453;object-fit:contain}
.bigart{display:block;width:100%;aspect-ratio:1082/1453;max-height:calc(92vh - 96px);object-fit:contain}
#big:has(.bigart){width:min(680px,94vw,calc((92vh - 96px)*.745 + 28px))}
.guide{text-align:center;font-size:clamp(20px,2.4vw,28px);margin:6px 0 0;color:var(--navy)}
dialog{border:0;padding:0;border-radius:24px;width:min(680px,94vw);max-height:92vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(23,44,92,.55)}
.big{--d:var(--c);--d:color-mix(in srgb,var(--c) 78%,#000);padding:14px}
.big .bb{display:flex;align-items:baseline;gap:10px;background:var(--d);color:#fff;border-radius:14px;padding:8px 16px;flex-wrap:wrap}
.big .bb b{font-weight:400;font-size:clamp(28px,5vw,40px)}
.big .bb em{margin-left:auto;font-style:normal;font-size:clamp(18px,3vw,24px)}
.big .bb span{font-size:clamp(18px,3vw,24px)}
.big .ba{position:relative;display:flex;justify-content:center;align-items:center;gap:26px;color:var(--d);margin:10px 0}
.big .ba svg{width:clamp(100px,24vw,150px);height:auto}
.big .ba strong{font-family:system-ui,sans-serif;font-weight:800;font-size:clamp(40px,8vw,64px);color:var(--ink)}
.big .ext{position:absolute;top:0;right:0;font-style:normal;color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:clamp(15px,2.4vw,19px)}
.big .fr{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px;font-size:clamp(19px,3vw,25px);line-height:1.35;margin:6px 4px;word-break:keep-all}
.big .fr b{font-weight:400;color:var(--d)}
.big .pw{margin-top:10px;background:color-mix(in srgb,var(--c) 14%,#fff);border:3px solid var(--d);border-radius:14px;padding:8px 14px;font-size:clamp(19px,3vw,25px);line-height:1.35;word-break:keep-all}
.big .pw b{font-weight:400;color:var(--d)}
.closer{display:block;margin:0 auto 14px}

/* OX */
.quiz{max-width:880px;margin:0 auto;text-align:center}
.score{font-size:24px;color:var(--sub)}
.score b{font-weight:400;color:var(--warm-d);font-size:1.3em}
.q{background:var(--sky);border-radius:28px;padding:24px 20px;margin:10px 0;font-size:clamp(24px,3.4vw,36px);line-height:1.35;word-break:keep-all;min-height:130px;display:grid;place-items:center}
.ox{display:flex;gap:20px;justify-content:center}
.ox button{width:min(42%,220px);aspect-ratio:1.45;border-radius:32px;font-size:clamp(70px,12vw,100px);line-height:1;color:#fff;font-family:system-ui,sans-serif;font-weight:800}
.ox .o{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.ox .x{background:var(--ruby);box-shadow:0 8px 0 var(--ruby-d)}
.ox button:active{transform:translateY(4px)}
.ox button:disabled{opacity:.4}
.fb{min-height:66px;margin:16px 0 8px;font-size:clamp(21px,2.8vw,28px);line-height:1.36;word-break:keep-all}
.fb.good{color:#1f8a57}.fb.bad{color:#c8283a}

footer{background:var(--sky);padding:14px;text-align:center;font-size:17px;color:var(--navy);line-height:1.6}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:"Jua",sans-serif;font-size:20px;padding:12px 26px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;white-space:nowrap}
.toast.on{opacity:1}
.conf{position:fixed;top:-20px;width:14px;height:14px;z-index:98;pointer-events:none;animation:fall linear forwards}
.spk{position:fixed;z-index:97;pointer-events:none;font-size:28px;line-height:1;color:#ffc93c;text-shadow:0 0 6px #fff;animation:spk .9s ease-out forwards}
.flash{position:fixed;inset:0;z-index:95;pointer-events:none}
.heat{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(255,110,20,.45) 74%,rgba(255,50,0,.82))}
.heat svg{position:absolute;left:0;bottom:0;width:100%;height:44vh}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spk{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(120deg);opacity:0}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (max-width:760px){
  header{padding:6px 10px}
  .head-in{gap:6px}
  .brand{font-size:13px}
  .share{font-size:15px;padding:4px 12px;min-height:44px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 0 var(--navy-d)}
  .mute{width:44px;height:44px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05),0 3px 0 var(--line)}
  nav{margin-top:8px;padding:0 10px;gap:5px}
  .tab{min-height:48px;border-radius:14px}
  main{padding:6px 10px 12px}
  .bar{gap:6px;min-height:38px}
  .dot-wrap{gap:4px}
  .dot{width:15px;height:15px;border-width:2px}
  .stars{margin-left:2px}
  .again{font-size:14px;min-height:36px;padding:2px 10px}
  .stage{height:auto;aspect-ratio:2/1;border-radius:18px}
  .hand{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .hand.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gc{border-radius:12px;padding-bottom:6px;border-width:2px}
  .result.on{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:18px}
  .result .row{grid-column:1/-1}
  .bbtn{font-size:20px;min-height:54px;padding:6px 20px}
  .share.bbtn{font-size:15px;min-height:44px;padding:4px 12px}
  .mute.bbtn{min-height:0;padding:0}
  .again.bbtn{font-size:14px;min-height:36px;padding:2px 10px}
  .dex{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
}
</style>
</head>
<body>
<header><div class="head-in">
  <div class="titles"><div class="brand">어게인 실험과학 수학학원</div><h1>상황에 맞는 기체 카드를 내요!</h1></div>
  <button class="bbtn white mute" id="mute" aria-label="소리 끄기" aria-pressed="false">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
  </button>
  <button class="bbtn share" id="share">공유하기</button>
</div></header>

<nav>
  <button class="tab on" data-t="0"><span class="lb"></span><span class="star">★</span></button>
  <button class="tab" data-t="1"><span class="lb"></span><span class="star">★</span></button>
  <button class="tab" data-t="2"><span class="lb">카드 도감</span><span class="star">★</span></button>
  <button class="tab" data-t="3"><span class="lb">OX 퀴즈</span><span class="star">★</span></button>
</nav>

<main>
<section class="panel on" id="pGame">
  <div class="bar">
    <div class="dot-wrap"><span id="dots" style="display:contents"></span><span class="stars" id="stars"></span></div>
    <button class="bbtn white again" id="restart">처음 상황으로</button>
  </div>
  <div id="play">
    <div class="sit"><h2 id="sitT"></h2><p id="sitA"></p></div>
    <div class="stage" id="stage"></div>
    <div class="dock">
      <div id="handWrap">
        <div class="hint">하나, 둘, 셋! 카드를 번쩍! <small>끌어다 놓거나 눌러요</small></div>
        <div class="hand" id="hand"></div>
      </div>
      <div class="result" id="result">
        <div class="mark" id="mark"></div>
        <div class="rmsg" id="rmsg"></div>
        <div class="row">
          <button class="bbtn warm" id="next">다음 상황</button>
          <button class="bbtn" id="retry">다시 고르기</button>
        </div>
      </div>
    </div>
  </div>
  <div class="final" id="final">
    <h2>다 찾았어요!</h2>
    <span class="bigstar" id="finStars"></span>
    <p id="finT"></p>
    <div class="row"><button class="bbtn warm" id="finGo"></button><button class="bbtn white" id="finRe">처음부터 다시</button></div>
  </div>
</section>

<section class="panel" id="pDex">
  <p class="guide">카드를 누르면 크게 읽을 수 있어요.</p>
  <div class="dex" id="dex"></div>
</section>

<section class="panel" id="pOx">
  <div class="quiz">
    <div class="score"><span id="qn">1</span> / <span id="qt"></span> · 맞힌 수 <b id="sc">0</b></div>
    <div class="q" id="q"></div>
    <div class="ox" id="ox"><button class="o" data-a="O">O</button><button class="x" data-a="X">X</button></div>
    <div class="fb" id="qfb"></div>
    <div class="row"><button class="bbtn" id="qnext" hidden>다음 문제</button></div>
  </div>
</section>
</main>

<footer>어게인 실험과학 수학학원<br>교육문의 010.2976.5774</footer>
<div class="toast" id="toast">주소가 복사됐어요</div>
<dialog id="big"><div class="big" id="bigB"></div><button class="bbtn closer" id="bigX">닫기</button></dialog>

<script src="data.js"></script>
<script src="icons.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const R=(a,b)=>a+Math.random()*(b-a);

/* ---------- 소리 ---------- */
let ac, muted=false;
function audio(){ if(muted) return null; if(!ac){const A=window.AudioContext||window.webkitAudioContext; if(A) ac=new A();} if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(freq,dur,vol,type='sine',when=0,freqEnd){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t); if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,f0,f1,q=1,when=0){
  const a=audio(); if(!a) return;
  const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime+when;
  s.buffer=buf; f.type='bandpass'; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.12); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur+.05);
}

function confetti(){

  for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='conf';

    document.body.appendChild(d); setTimeout(()=>d.remove(),3600); }
}
function sparkleAt(x,y,n=14){
  for(let i=0;i<n;i++){ const s=document.createElement('span'), a=i/n*Math.PI*2, d=70+Math.random()*90;
    s.className='spk'; s.textContent='✦'; s.style.left=x+'px'; s.style.top=y+'px';

$('#share').onclick=async()=>{
  const url=location.href;
  if(navigator.share){ try{ await navigator.share({title:document.title,url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); }
  catch(e){ const t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const el=$('#toast'); el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800);
};

let timers=[];
const later=(ms,f)=>timers.push(setTimeout(f,ms));
const A=(el,kf,ms,o)=>el.animate(kf,{duration:ms,fill:'both',easing:'ease-in-out',...o});

}
function rise(s,c,x=360,y=200,n=10){                 // 기체가 위로 올라가 사라짐
  for(let i=0;i<n;i++){ const g=add(s,`<g>${GASB(c)}</g>`), x0=x+R(-80,80), y0=y+R(-20,40);
    A(g,[{transform:`translate(${x0}px,${y0}px) scale(.8)`,opacity:1},{transform:`translate(${x0+R(-60,60)}px,-50px) scale(1.15)`,opacity:.15}],R(1000,1500),{delay:i*80,easing:'ease-in'}).onfinish=()=>g.remove(); }
}
function spray(s,x,y,n,{cols=['#ffd23f','#ff8a3d','#ff5a1f'],d=[60,200],r=[3,7],ms=[500,1000],up=0}={}){
  for(let i=0;i<n;i++){ const a=R(0,6.283), D=R(...d), c=add(s,`<circle cx="${x}" cy="${y}" r="${R(...r).toFixed(1)}" fill="${cols[i%cols.length]}"/>`);
    const to=`translate(${Math.cos(a)*D}px,${Math.sin(a)*D-up}px)`;
    A(c,[{transform:'translate(0,0)',opacity:1,easing:'cubic-bezier(.15,.7,.4,1)'},{transform:to,opacity:.9,offset:.7},{transform:to,opacity:0}],R(...ms),{easing:'linear'}).onfinish=()=>c.remove(); }
}
function smoke(s,x,y,col='#8b929a',n=6,ms=1500){

function flashAll(c='#fff',ms=480){ const d=document.createElement('div'); d.className='flash'; d.style.background=c; document.body.append(d);

    ${BG('#0f1730')}${[[40,40],[140,80],[250,30],[420,60],[560,34],[680,90],[-120,70],[820,44]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.5" fill="#fff"/>`).join('')}
    ${WIDE(296,300,'#232b3d')}<g fill="#4b5468">${Array.from({length:14},(_,i)=>`<rect x="${-900+i*180}" y="330" width="90" height="8" rx="3"/>`).join('')}</g>

    boom({s}){ return boom(s,238,250,1.05); },

  svg:`${BG('#dff0fb')}<rect x="-900" y="-200" width="1270" height="760" fill="#fff1dc"/><rect id="cool" x="-900" y="-200" width="1270" height="760" fill="#a9d4f5" opacity="0"/><rect id="warmB" x="-900" y="-200" width="1270" height="760" fill="#ffb066" opacity="0"/>
    <rect x="22" y="170" width="60" height="146" rx="8" fill="#fff" stroke="#24344a" stroke-width="4"/><path d="M36,180V306M52,180V306M68,180V306" stroke="#9fb3c4" stroke-width="5"/>
    <g fill="#fff" stroke="#a9c9e2" stroke-width="2">${[[480,60],[560,120],[640,70],[700,170],[520,220],[610,270],[470,310],[680,300],[800,100],[860,240]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7"/>`).join('')}</g>

    <rect x="166" y="24" width="28" height="128" rx="14" fill="#fff" stroke="#24344a" stroke-width="4"/><circle cx="180" cy="150" r="22" fill="#e8562a" stroke="#24344a" stroke-width="4"/>

  enter({q,c}){ q('gap').setAttribute('fill',c.color); fade(q('gap'),.55,PUFF); },
  fx:{
    warm({s,q}){ dingS(); fade(q('ars'),1,200); fade(q('warmB'),.45,1300); A(q('thm'),[{transform:'scaleY(.5)'},{transform:'scaleY(.95)'}],1400);
      s.querySelectorAll('.ar').forEach((a,i)=>{ const y=205+i*50; forever(a,[{transform:`translate(96px,${y}px) scaleX(1)`,opacity:1},{transform:`translate(252px,${y}px) scaleX(1)`,opacity:1,offset:.45},{transform:`translate(252px,${y}px) scaleX(-1)`,opacity:1,offset:.58},{transform:`translate(116px,${y}px) scaleX(-1)`,opacity:.1}],1700,{delay:i*230}); });
      return 1500; },
    danger({s}){ return danger(s,370,172); },
    none({s,q}){ tone(330,1.2,.1,'sine',0,160); fade(q('ars'),1,200); fade(q('cool'),.55,1300); A(q('thm'),[{transform:'scaleY(.5)'},{transform:'scaleY(.12)'}],1400);
      s.querySelectorAll('.ar').forEach((a,i)=>{ const y=205+i*50; forever(a,[{transform:`translate(96px,${y}px)`,opacity:1},{transform:`translate(640px,${y}px)`,opacity:.15}],1400,{delay:i*230}); });

};

/* ---------- 게임 ---------- */
const stageEl=$('#stage'), handEl=$('#hand'), resEl=$('#result');
let busy=false;
function stopScene(){ timers.forEach(clearTimeout); timers=[]; busy=false; handEl.classList.remove('busy'); stageEl.classList.remove('over'); }
function drawStage(sit){
  stageEl.innerHTML=`<svg viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${sit.title}">${SCENES[sit.id].svg}</svg>`;
  const s=stageEl.firstChild; SCENES[sit.id].init?.(s);
  delete stageEl.dataset.fx;
  return s;
}
const cardHTML=(k,extra='')=>{ const c=CARDS[k]; return `<button class="gc" data-k="${k}" style="--c:${c.color}"><span class="bd"><span>${c.no}</span><span>${c.sym}</span></span><span class="ic">${ICONS[k]}</span><span class="nm">${c.name}</span>${extra}</button>`; };
function render(){
  const M=MODES[cur], m=st[cur];
  if(m.solved) advance(m);
  $('#dots').innerHTML=M.list.map((_,i)=>`<span class="dot ${m.marks[i]?m.marks[i]+' done':''} ${i===m.i&&!m.over?'now':''}"></span>`).join('');
  $('#stars').textContent='★ '+m.stars;
  $('#play').hidden=m.over; $('#final').classList.toggle('on',m.over);
  if(m.over){
    tabs[cur].classList.add('done');
    $('#finStars').textContent='★'.repeat(m.stars)||'★ 0';
    $('#finT').textContent=`${M.list.length}가지 중 ${m.stars}가지를 첫 번에 맞혔어요! ${M.tail}`;
    $('#finGo').textContent=M.goT; return;
  }
  const sit=M.list[m.i];
  $('#sitT').textContent=sit.title; $('#sitA').textContent=sit.ask;
  drawStage(sit);
  handEl.className='hand n'+M.hand.length;
  handEl.innerHTML=M.hand.map(k=>cardHTML(k)).join('');
  m.tried.forEach(k=>handEl.querySelector(`[data-k="${k}"]`).classList.add('played'));
  $('#handWrap').hidden=false; resEl.className='result';
}
function advance(m){ const M=MODES[cur]; m.i++; m.tried.clear(); m.solved=false; if(m.i>=M.list.length) m.over=true; }
function play(key,from){
  if(busy) return;
  const m=st[cur], sit=MODES[cur].list[m.i], r=sit.res[key], c=CARDS[key], S=SCENES[sit.id];
  busy=true; handEl.classList.add('busy'); audio(); clickS();
  const s=drawStage(sit); stageEl.dataset.fx=r.fx;
  const q=id=>s.querySelector('#'+id), ctx={s,c,q};
  if(from) flyCard(key,from);
  puff(s,c,...S.at); S.enter?.(ctx);
  later(PUFF,()=>{
    const h=S.fx[r.fx];
    if(!h){ console.error('처리 안 된 fx',sit.id,r.fx); later(300,()=>showResult(sit,key)); return; }
    later(h.call(S.fx,ctx),()=>showResult(sit,key));
  });
}
function flyCard(key,from){
  const t=stageEl.getBoundingClientRect(), g=document.createElement('div');
  g.innerHTML=cardHTML(key); const b=g.firstChild; b.classList.add('ghost');
  Object.assign(b.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'}); document.body.append(b);
  const dx=t.left+t.width/2-from.left-from.width/2, dy=t.top+t.height/2-from.top-from.height/2;
  b.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1.25) rotate(-4deg)`,opacity:1,offset:.65},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],{duration:520,easing:'ease-out',fill:'both'}).onfinish=()=>b.remove();
}
function showResult(sit,key){
  const m=st[cur], r=sit.res[key], first=m.tried.size===0;
  m.tried.add(key); busy=false; handEl.classList.remove('busy');
  $('#handWrap').hidden=true; resEl.className='result on '+r.grade;
  $('#mark').innerHTML={ok:'<b>○</b>정답!',near:'<b>△</b>아쉬워요',bad:'<b>✕</b>실패!'}[r.grade];
  $('#rmsg').textContent=r.msg;
  const ok=r.grade==='ok';
  $('#next').hidden=!ok; $('#retry').hidden=ok;
  $('#next').textContent=m.i+1<MODES[cur].list.length?'다음 상황':'결과 보기';
  if(ok){
    m.solved=true; m.marks[m.i]=first?'first':'done'; if(first) m.stars++;
    $('#stars').textContent='★ '+m.stars; confetti(); fireworks(); cheer();
  } else (r.grade==='near'?nearS:failS)();
  resEl.scrollIntoView({block:'nearest'});
}
$('#retry').onclick=()=>{ clickS(); stopScene(); render(); };
$('#next').onclick=()=>{ clickS(); stopScene(); const m=st[cur]; render();
  if(m.over){ confetti(); fireworks(); cheer(); } };
function restart(){ clickS(); stopScene(); st[cur]=fresh(); tabs[cur].classList.remove('done'); render(); }
$('#restart').onclick=restart; $('#finRe').onclick=restart;
$('#finGo').onclick=()=>{ clickS(); showTab(MODES[cur].go); };

/* 카드 끌기 · 누르기 (마우스와 터치 모두) */
handEl.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.gc'); if(!b||busy) return;
  e.preventDefault(); audio();
  const r=b.getBoundingClientRect(), id=e.pointerId, x0=e.clientX, y0=e.clientY; let g=null;
  const inStage=ev=>{ const t=stageEl.getBoundingClientRect(); return ev.clientX>=t.left&&ev.clientX<=t.right&&ev.clientY>=t.top&&ev.clientY<=t.bottom; };
  const move=ev=>{ if(ev.pointerId!==id) return; const dx=ev.clientX-x0, dy=ev.clientY-y0;
    if(!g&&Math.hypot(dx,dy)>10){ g=b.cloneNode(true); g.classList.add('ghost'); Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'}); document.body.append(g); b.classList.add('lift'); }
    if(g){ g.style.transform=`translate(${dx}px,${dy}px) rotate(-3deg) scale(1.08)`; stageEl.classList.toggle('over',inStage(ev)); } };
  const end=ev=>{ if(ev.pointerId!==id) return;
    removeEventListener('pointermove',move); removeEventListener('pointerup',end); removeEventListener('pointercancel',end);
    stageEl.classList.remove('over');
    if(g){ const rect=g.getBoundingClientRect(); g.remove(); b.classList.remove('lift'); if(ev.type==='pointerup'&&inStage(ev)) play(b.dataset.k,rect); }
    else if(ev.type==='pointerup') play(b.dataset.k,r); };
  addEventListener('pointermove',move); addEventListener('pointerup',end); addEventListener('pointercancel',end);
});
handEl.addEventListener('click',e=>{ if(e.detail===0){ const b=e.target.closest('.gc'); if(b) play(b.dataset.k,b.getBoundingClientRect()); } }); // 스위치·키보드로 누를 때

/* ---------- 도감 ---------- */
const artAlt=c=>`${c.name} 카드 ${c.sym}. ${c.nick}. 공기 비율 : ${c.air}. 특징 : ${c.trait}.${c.use?` 사용 : ${c.use}.`:''} 특수능력 : ${c.power}${c.powerText?' — '+c.powerText:''}${c.ext?' 확장 카드':''}`;
$('#dex').innerHTML=[...BASE,...EXT].map(k=>{ const c=CARDS[k]; return c.art
  ?`<button class="gc art" data-k="${k}" style="--c:${c.color}"><img src="${c.art}" alt="${artAlt(c)}" loading="lazy"></button>`
  :cardHTML(k,`<span class="nk">${c.nick}</span>`); }).join('');
$('#dex').onclick=e=>{ const b=e.target.closest('.gc'); if(!b) return; audio(); clickS();
  const k=b.dataset.k, c=CARDS[k], rows=[['공기 비율',c.air],['특징',c.trait],['사용',c.use]].filter(r=>r[1]);
  const B=$('#bigB'); B.style.setProperty('--c',c.color);
  B.innerHTML=c.art?`<img class="bigart" src="${c.art}" alt="${artAlt(c)}">`:`<div class="bb"><span>${c.no}</span><b>${c.name}</b><em>${c.nick}</em></div>
    <div class="ba">${ICONS[k]}<strong>${c.sym}</strong>${c.ext?'<i class="ext">확장 카드</i>':''}</div>
    ${rows.map(([a,t])=>`<div class="fr"><b>${a}</b><span>${t}</span></div>`).join('')}
    <div class="pw"><b>특수능력 : ${c.power}</b>${c.powerText?' — '+c.powerText:''}</div>`;
  $('#big').showModal(); };
$('#bigX').onclick=()=>{ clickS(); $('#big').close(); };
$('#big').onclick=e=>{ if(e.target===$('#big')) $('#big').close(); };

/* ---------- OX ---------- */
let qi=0, score=0;
$('#qt').textContent=OX.length;
function showQ(){
  $('#ox').hidden=false; $('#qn').textContent=qi+1; $('#sc').textContent=score; $('#q').textContent=OX[qi][0];
  $('#qfb').textContent=''; $('#qfb').className='fb'; $('#qnext').hidden=true; $$('#ox button').forEach(b=>b.disabled=false);
}
$$('#ox button').forEach(b=>b.onclick=()=>{
  const [,yes,why]=OX[qi], ans=yes?'O':'X', ok=b.dataset.a===ans; audio(); $$('#ox button').forEach(x=>x.disabled=true);
  if(ok){ score++; cheer(); const r=b.getBoundingClientRect(); sparkleAt(r.left+r.width/2,r.top+r.height/2); } else failS();
  $('#sc').textContent=score; $('#qfb').className='fb '+(ok?'good':'bad');
  $('#qfb').textContent=(ok?'딩동댕! ':`아쉬워요. 정답은 ${ans}예요. `)+why;
  $('#qnext').textContent=qi<OX.length-1?'다음 문제':'결과 보기'; $('#qnext').hidden=false;
});
$('#qnext').onclick=()=>{ clickS();
  if(qi===OX.length){ qi=0; score=0; showQ(); return; }
  if(++qi<OX.length){ showQ(); return; }
  $('#q').textContent=`${OX.length}문제 중 ${score}문제를 맞혔어요!`; $('#ox').hidden=true; $('#qfb').className='fb good';
  $('#qfb').textContent=score===OX.length?'완벽해요! 모두 맞혔어요.':score>=OX.length-2?'잘했어요! 틀린 문제는 카드 도감에서 다시 찾아봐요.':'괜찮아요. 카드 도감을 읽고 또 도전해요!';
  $('#qnext').textContent='다시 하기'; if(score===OX.length){ tabs[3].classList.add('done'); confetti(); fireworks(); cheer(); }
};
showQ();

/* ---------- 시작 (주소 끝 #tab1~#tab4 로 처음 탭 고르기) ---------- */
const hashTab=location.hash.match(/^#tab([1-4])$/);
showTab(hashTab?hashTab[1]-1:0);
</script>
